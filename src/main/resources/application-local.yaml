# 이 파일을 복사해서 application-local.yml 로 이름을 바꾸고,
# 본인 MySQL 접속 정보를 채워 넣으세요.
# application-local.yml 은 .gitignore 에 등록되어 있어 git에 올라가지 않습니다.

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/defaultdb?useSSL=true&requireSSL=true&sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: avnadmin
    password: ${DB_PASSWORD}
