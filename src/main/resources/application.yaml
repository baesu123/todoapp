spring:
  application:
    name: todoapp
  config:
    import: optional:classpath:application-local.yaml
  thymeleaf:
    cache: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.todoapp.domain
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

logging:
  level:
    com.example.todoapp: debug
