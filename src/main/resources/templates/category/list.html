<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>카테고리 관리 - Todo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container narrow">
    <h2>카테고리 관리</h2>

    <p class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <ul class="category-list">
        <li th:each="c : ${categories}">
            <span th:text="${c.name}">카테고리명</span>
            <span class="badge muted" th:if="${c.memberId == null}">공용</span>
            <form th:if="${c.memberId != null}" th:action="@{/categories/{id}/delete(id=${c.id})}" method="post"
                  class="inline-form" onsubmit="return confirm('삭제하시겠습니까?');">
                <button type="submit" class="link-button danger">삭제</button>
            </form>
        </li>
    </ul>

    <h3>새 카테고리 추가</h3>
    <form th:action="@{/categories}" th:object="${categoryForm}" method="post" class="form inline">
        <input type="text" th:field="*{name}" placeholder="카테고리 이름" required>
        <button type="submit" class="btn primary">추가</button>
        <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
    </form>

    <p class="helper-text">
        <a th:href="@{/todos}">← 할일 목록으로</a>
    </p>
</div>
</body>
</html>
