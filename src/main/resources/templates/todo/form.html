<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${todoForm.id == null ? '새 할일 - Todo' : '할일 수정 - Todo'}">할일 폼</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container narrow">
    <h2 th:text="${todoForm.id == null ? '새 할일 등록' : '할일 수정'}">할일 폼</h2>

    <form th:action="${todoForm.id == null} ? @{/todos} : @{/todos/{id}(id=${todoForm.id})}"
          th:object="${todoForm}" method="post" class="form">

        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" th:field="*{title}" required autofocus>
            <p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
        </div>

        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" th:field="*{content}" rows="4"></textarea>
        </div>

        <div class="form-group">
            <label for="categoryId">카테고리</label>
            <select id="categoryId" th:field="*{categoryId}">
                <option value="">선택 안 함</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="dueDate">마감일</label>
            <input type="date" id="dueDate" th:field="*{dueDate}">
        </div>

        <div class="form-group checkbox-group" th:if="${todoForm.id != null}">
            <label>
                <input type="checkbox" th:field="*{completed}">
                완료됨
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn primary">저장</button>
            <a th:href="@{/todos}" class="btn">취소</a>
        </div>
    </form>
</div>
</body>
</html>
